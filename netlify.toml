# ══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE NETLIFY · Cotizador de Actividades Vulnerables
#
#   sitio/      lo que ve el navegador. Aquí vive el cotizador.
#   funciones/  lo que corre en el servidor. Aquí vive el redactor
#               de propuestas, el único que toca la llave de Claude.
#
# El redactor es una función DE BORDE, no una función normal. Las
# normales se cortan a los diez segundos y redactar una propuesta
# tarda entre treinta y sesenta: por eso devolvían 504. Las de borde
# no tienen ese límite.
#
# Se atiende en la dirección /api/propuesta
# ══════════════════════════════════════════════════════════════

[build]
  publish = "sitio"
  edge_functions = "funciones"

[[edge_functions]]
  path = "/api/propuesta"
  function = "propuesta"
